[project]
name = "agentlab"
version = "0.1.0"
description = "AI Agent 学习实验室 - 从零手搓 Agent"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]
wechat = [
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pyperclip>=1.8.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
